# logging
wandb_log: false
wand_group: null

# optimizer
optimizer: adamw
num_epochs_warmup: 1
sched_decay_factor: 0.8
use_class_weights: false
use_focal_loss: false
use_scheduler: true
patience: 5
grad_clip: 3.
lr_head: 0.001
lr_core: 0.00001
batch_size: 512
num_workers: 32
epochs: 20
linear_probing: false
precision: '16-mixed'
compile_model: true

# regularizers
dropout: 0.
drop_path_prob: 0.5
layerwise_lr_decay: 0.75 
wd: 0.01

# model
use_ecg_founder: false
use_st_mem: false
use_ecg_jepa: false
use_batch_norm_jepa: false

patch_size: 25
sampling_freq: 100
proj_factor: 2
num_heads: 4
xlstm_config: ["s","s","m","m","s","s","m","m","s"]
activation_fn: "gelu"
cls_type: avg
embedding_size: 1024
use_final_layer_norm: true
patch_embedding: linear
encoder_type: vanilla
bidirectional: true
num_reg_token: 0
cls_normalization: null

# augmentations
random_surrogate_prob: 0.
random_jitter_prob: 0.
random_change_amplitude: 0.
random_drop_leads: 0.
random_resample: false
shift_baseline_wander_in_sample: false
shuffle_baseline_wander_in_batch: false
nk_clean: false
normalize: false
random_crop: 1.
random_paper_layout: 0.

# dataset
num_classes: 1
monitor_metric: val_auroc_avg
monitor_mode: max
max_length_signal: 1200
leads: ['I', 'II', 'III', 'aVR', 'aVL', 'aVF', 'V1', 'V2', 'V3', 'V4', 'V5', 'V6']
data_folder_mimic: /media/Volume/data/MIMIC_IV/
labels_file_mimic: /media/Volume/data/MIMIC_IV/records_w_diag_icd10.csv
n_global_view: 1
n_local_view: 0
task: multiclass

label_list: {'NTproBNP':2, 'Urea Nitrogen':3, 'Hemoglobin':3, 'Creatinine':3,
             'Ferritin':3, 'Hematocrit':3, 'Albumin':3, 'RDW-SD':3, 'Anion Gap':3,
             'RDW':3, 'Bicarbonate':3, 'Bilirubin, Total':2, 'INR(PT)':3,
             'Red Blood Cells':3, 'PT':3, 'Creatine Kinase (CK)':3, 'MCHC':3,
             'Calcium, Total':3, 'Lymphocytes':3}