program: sweep.py
method: random
name: train-xLSTM-3
metric:
  goal: maximize
  name: test_f1/mean


parameters:
  pretrain:
    value: False
  lr_head:
    min: 0.00001
    max: 0.01
  lr_xlstm:
    min: 0.0000001
    max: 0.0001
  wd:
    min: 0.
    max: 0.1
  batch_size:
    value: 128
  num_workers:
    value: 32
  epochs:
    value: 30
  patch_size:
    value: 64
  dropout:
    value: 0.3
  embedding_size:
    value: 512
  deterministic: 
    value: True 
  use_tab_data:
    value: False
  patience:
    value: 15
  is_sweep:
    value: True
  grad_clip:
    value: 0.5
  weight_tying:
    value: False
  use_class_weights:
    values: [True, False]
  label_smoothing:
    value: 0.

  optimizer:
    value: 'adamw'
  use_scheduler:
    value: True
  num_epochs_warmup:
    value: 1
  num_epochs_warm_restart:
    value: 15
  sched_decay_factor:
    value: 0.8
  random_surrogate_prob:
    values: [0.]
  random_jitter_prob:
    values: [0.]
  loss_type:
    value: ''
  split_by_patient:
    values: [True, False]

  activation_fn:
    value: 'relu'
  xlstm_config:
    value: ['m', 's', 'm', 's', 'm', 's', 'm']
  wandb_log:
    value: True
  num_heads:
    value: 4
  checkpoint:
    value: 'pretrained_models/medium_512/checkpoints/epoch=38-step=174330.ckpt'
  oversample:
  xlstm_type:
    value: 'small'
  patch_embedding:
    value: 'enriched'
  reconstruct_embedding:
    value: 'linear'
  bidirectional:
    value: False
  multi_token_prediction:
    value: False


  normalize:
    value: True
  random_shift:
    value: True
  random_drop_leads:
    value: 0.
  nk_clean:
    value: True
  leads: 
    value: ['I', 'II', 'III', 'aVR', 'aVL', 'aVF', 'V1', 'V2', 'V3', 'V4', 'V5', 'V6']
  
  data_folder_mit:
    value: '/media/Volume/data/MIT-BHI/data/'
  name:
    values: ['between_hb', 't_wave_split', 'static']
  checkpoint:
    value: 'pretrain-xLSTM/6z3h8m30/checkpoints/epoch=33-step=141474.ckpt'
  

  
  