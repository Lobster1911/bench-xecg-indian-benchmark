# training loop hyperparameters
epochs: 50
lr: 0.0001
reconstruction_lr: 0.001
wd: 0.1
layerwise_lr_decay: 1. #0.9

# final_wd: 0.4
dropout: 0.
grad_clip: null
patience: 300
wandb_log: true
debug: false
monitor_metric: val_lejepa_loss
monitor_mode: min
monitor_delay_epochs: 5
optimizer: adamw
loss_type: mse_min_max
strategy: lejepa
num_workers: 32

# xlstm hyperparameters
embedding_size: 256
xlstm_config: ["s","s","m","m","s"] #,"s","m","m","s"] #,"m","s","s","m","m","s"]
# xlstm_config: ['m','m','m','m','m']
encoder_type: vanilla
num_heads: 4
drop_path_prob: 0.
num_reg_token: 0
patch_embedding: attention
bidirectional: true
cls_type: attn_pool
cls_normalization: layer
use_final_layer_norm: false
max_length_signal: 1200
# dataloaders
batch_size: 256
activation_fn: gelu

# augmentations
normalize: false
nk_clean: false
shift_baseline_wander_in_sample: false
shuffle_baseline_wander_in_batch: true
random_drop_leads: 0.2
keep_lead_II: true
random_surrogate_prob: 0.
random_jitter_prob: 0.
random_crop: 0.8
random_change_amplitude: 0.2
random_resample: true

mask_ratio: 0.3
masking_type: 'block' # 'random' or 'block'

# data 
patch_size: 25
sampling_freq: 100
pretrain_datasets: ['code15', 'incart', 'chapman'] #, 'ptbxl]
precision: '16-mixed'

# schedulers
use_scheduler: true
num_epochs_warmup: 2

# teacher student config
ema_0: 0.99
ema_1: 1.
start_train_head_at_epoch: 0
plot_samples: true

# sim dino hyp
lambda_loss: 0.8
n_local_view: 4
n_global_view: 2
global_random_crop: 0.8
local_random_crop: 0.4
win_len_incart: 12