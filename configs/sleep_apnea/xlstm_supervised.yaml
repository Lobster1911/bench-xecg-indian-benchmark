wandb_log: true
wandb_group: best_xlstm_sup

batch_size: 32

epochs: 20

lr_head: .0001
lr_xlstm: .0001

layerwise_lr_decay: 1.
drop_path_prob: 0.
wd: 0.

linear_probing: false
deterministic: false

embedding_size: 1024
encoder_type: vanilla
xlstm_config: ["s","s","m","m","s","s","m","m","s"]
# checkpoint: pretrain-xLSTM/0rgc8fun/checkpoints/epoch=49-step=504700.ckpt
cls_type: max

use_final_layer_norm: false
cls_normalization: null  # 'batch', 'layer', 'instance'


data_folder_sleep_apnea:  /home/datasets/sleep_apnea/physionet_apnea/

window_size: 60 # 30 minutes in samples
context_size: 240