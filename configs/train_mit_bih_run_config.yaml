# training loop hyp
wandb_log: true
wandb_group: test

lr_head: .001
lr_core: .0003
wd: 0.1
dropout: 0.
linear_probing: true
deterministic: false
batch_size: 96
num_workers: 64

use_st_mem: true

drop_path_prob: 0.5
layerwise_lr_decay: 0.75

skip_majority_class_samples: true
use_class_weights: false
split_val_by_patient: true

# half of 2.325 that is the normal sequence len for st-mem
win_len: 1163

data_folder_mit: /home/datasets/MIT-BIH_arrhythmia/
plot_predictions: true