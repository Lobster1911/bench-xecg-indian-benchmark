# training loop hyp
wandb_log: false
wandb_group: xlstm_no_mimic_ft
epochs: 15
lr_head: .1
lr_core: .001
wd: 0.1
linear_probing: false
deterministic: false
batch_size: 8
patience: 30
epochs: 30

embedding_size: 1024
encoder_type: vanilla
xlstm_config: ["s","s","m","m","s","s","m","m","s"]
checkpoint: pretrained_models/simdino/no_mimic_xlstm.ckpt

use_final_layer_norm: false
cls_normalization: null  # 'batch', 'layer', 'instance'
patch_embedding: linear

drop_path_prob:  0. #5
layerwise_lr_decay: 0. # 75

data_folder_sleep_apnea: /media/Volume/data/sleep_apnea/physionet_apnea/

plot_predictions: true
max_length_signal: 5000

use_ecg_founder: true