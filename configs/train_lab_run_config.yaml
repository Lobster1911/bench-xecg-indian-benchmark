# training loop hyp
wandb_log: false
wandb_group: best_xlstm_ft
epochs: 1
wd: 0.1
batch_size: 256

lr_head: 0.001
lr_xlstm: 0.00003
drop_path_prob: 0.5
layerwise_lr_decay: 0.75 # 0.75

linear_probing: false
deterministic: false

embedding_size: 1024
encoder_type: vanilla
xlstm_config: ["s","s","m","m","s","s","m","m","s"]
# checkpoint: pretrain-xLSTM/w3zrmkvx/checkpoints/epoch=48-step=494606.ckpt
checkpoint: pretrained_models/simdino/no_mimic_xlstm.ckpt

use_final_layer_norm: false
cls_normalization: null  # 'batch', 'layer', 'instance'

training_pct: 1.
