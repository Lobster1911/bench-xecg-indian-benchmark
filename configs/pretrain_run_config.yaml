epochs: 100
lr: 0.0003
wd: 0.0001
patch_size: 128
batch_size: 64
embedding_size: 1024
xlstm_config: [ 'm', 'm', 's', 's', 'm', 'm', 's', 's', 'm' ]
xlstm_type: vanilla
random_drop_leads: 0.4
dropout: 0.1
gradient_clipping: .5

# scheduler
use_scheduler: true
num_epochs_warm_restart: 10
num_epochs_warmup: 2
patience: 30

patch_embedding: enriched

loss_type: mse_grad_min_max
debug: true
bidirectional: true
wandb_log: true