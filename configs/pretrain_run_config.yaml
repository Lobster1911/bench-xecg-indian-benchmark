epochs: 100
lr: 0.003
wd: 0.00001
patch_size: 64
batch_size: 256
embedding_size: 1024
xlstm_config: [ 'm', 's', 'm', 's', 'm', 's', 'm', 's', 'm' ]
xlstm_type: original
random_drop_leads: 0.4
dropout: 0.
gradient_clipping: .5

# scheduler
use_scheduler: true
num_epochs_warm_restart: 10
num_epochs_warmup: 2
patience: 30

patch_embedding: enriched

loss_type: mse_grad_min_max
debug: false
bidirectional: false
wandb_log: true