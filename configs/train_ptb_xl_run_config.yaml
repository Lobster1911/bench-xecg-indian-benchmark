# patch_size: 50
patch_size: 25
use_final_layer_norm: false
cls_normalization: null  # 'batch', 'layer', 'instance'
bidirectional: true
cls_type: avg
# task: multiclass
num_reg_token: 0

#low_pass_filter: 30
#high_pass_filter: 0.5
use_scheduler: true
num_epochs_warmup: 1
patience: 20
monitor_metric: 'val_auroc'
monitor_mode: max
# batch_size: 96 #128
batch_size: 128
optimizer: adamw
grad_clip: 3.

sampling_freq: 100
# sampling_freq: 250
use_class_weights: true
use_focal_loss: false

random_surrogate_prob: 0.
random_jitter_prob: 0.
random_drop_leads: 0.
random_resample: false
random_crop: 1. # 0.9
normalize: false
nk_clean: false

shift_baseline_wander_in_sample: false
shuffle_baseline_wander_in_batch: false
random_change_amplitude: 0.

classification_taksk: 'diagnosis_superclass'
num_classes: 5 # chenge to 23 if diagnosis_subclass

data_folder_ptbxl: /scratch/datasets/ptb-xl/raw/1.0.3/records500/
labels_file_ptbxl: /scratch/datasets/ptb-xl/raw/1.0.3/exams_filtered.csv

drop_path_prob: 0. # 0.75
layerwise_lr_decay: 0.75 # 0.75
training_pct: 1.
