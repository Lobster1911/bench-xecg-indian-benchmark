# training loop hyp
wandb_log: true
wandb_group: new_models
epochs: 50
lr_head: .001
lr_xlstm: .00001
wd: 0.1
dropout: 0.
linear_probing: false
task: multilabel
deterministic: true

use_ecg_founder: false
use_st_mem: false
use_ecg_jepa: false

# embedding_size: 1536
embedding_size: 1024
# encoder_type: transformer
encoder_type: vanilla
xlstm_config: ["s","s","m","m","s","s","m","m","s"]
# xlstm_config: ['m','m','s','s','m','m','s','s','m','m','m']
