program: sweep.py
method: random
name: train-xLSTM-5
metric:
  goal: maximize
  name: test_f1/mean

parameters:
  pretrain:
    value: False
  lr_head:
    values: [ 0.0001, 0.001, 0.01 ]
  lr_xlstm:
    values: [ 0.00001, 0.0001, 0.001 ]
  wd:
    values: [ 0.1, 0.01, 0.001, 0. ]
  batch_size:
    value: 128
  num_workers:
    value: 16
  epochs:
    value: 30
  patch_size:
    value: 64
  dropout:
    values: [0.1, 0.3, 0.5]
  embedding_size:
    value: 512
  deterministic: 
    value: True 
  use_tab_data:
    value: False
  patience:
    value: 15
  is_sweep:
    value: True
  grad_clip:
    value: 0.5
  weight_tying:
    value: False
  use_class_weights:
    value: False
  label_smoothing:
    value: 0.
  num_classes:
    value: 5

  optimizer:
    value: 'adamw'
  use_scheduler:
    value: True
  num_epochs_warmup:
    value: 1
  num_epochs_warm_restart:
    value: 15
  sched_decay_factor:
    value: 0.8
  random_surrogate_prob:
    value: 0.
  random_jitter_prob:
    value: 0.
  loss_type:
    value: ''
  win_len:
    values: [8100, 5400, 2700, 1350]
  skip_majority_class_samples:
    values: [True, False]

  activation_fn:
    value: 'relu'
  xlstm_config:
    value: ['m', 's', 'm', 's', 'm', 's', 'm']
  wandb_log:
    value: True
  num_heads:
    value: 4
  checkpoint:
    value: 'pretrained_models/medium_512/checkpoints/epoch=38-step=174330.ckpt'
  encoder_type:
    value: 'small'
  patch_embedding:
    value: 'enriched'
  bidirectional:
    value: False



  normalize:
    value: True
  random_shift:
    value: True
  random_drop_leads:
    value: 0.
  nk_clean:
    value: True
  leads: 
    value: ['I', 'II', 'III', 'aVR', 'aVL', 'aVF', 'V1', 'V2', 'V3', 'V4', 'V5', 'V6']
  
  data_folder_mit:
    value: '/media/Volume/data/MIT-BHI/data/'
  name:
    value: 'static'
  checkpoint:
    value: 'pretrain-xLSTM/6z3h8m30/checkpoints/epoch=33-step=141474.ckpt'
  

  
  