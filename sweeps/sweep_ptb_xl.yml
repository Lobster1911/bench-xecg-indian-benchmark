program: sweep.py
method: random
name: train-ptb_xl-diagnosis_superclass
metric:
  goal: maximize
  name: test_f1/mean

parameters:
  task: 
    value: ptb_xl
  lr_head:
    min: 0.000001
    max: 0.0003
  lr_xlstm:
    min: 0.0000001
    max: 0.0003
  wd:
    min: 0.
    max: 0.1
  epochs:
    value: 30
  dropout:
    min: 0.1
    max: 0.5
  random_surrogate_prob: 
    min: 0.0
    max: 0.2
  random_jitter_prob: 
    min: 0.0
    max: 0.2
  random_drop_leads: 
    min: 0.0
    max: 0.2
  use_cls_token:
    values: [True, False]
  use_class_weights:
    values: [True, False]
  
  embedding_size:
    value: 1024
  is_sweep:
    value: True

  batch_size: 
    value: 128

  num_epochs_warm_restart:
    value: 30

  xlstm_config:
    value: [ 'm', 'm', 's', 's', 'm', 'm', 's', 's', 'm' ]
  wandb_log:
    value: True
  checkpoint:
    value: 'pretrained_models/bidirectional_ps64/bidirectional_ps64_u48oboqr.ckpt'
  patch_embedding:
    value: 'enriched'
  bidirectional:
    value: True
  patch_size:
    value: 64
  deterministic: 
    value: True
  use_scheduler:
    value: False

  normalize:
    value: True
  nk_clean:
    value: True
  leads: 
    value: ['I', 'II', 'III', 'aVR', 'aVL', 'aVF', 'V1', 'V2', 'V3', 'V4', 'V5', 'V6']
  
  data_folder_ptbxl: 
    value: '/media/Volume/data/PTB-XL/nkclean_360_12l'
  labels_file_ptbxl:
    value: '/media/Volume/data/PTB-XL/nkclean_360_12l/ptbxl_database.csv'


  

  
