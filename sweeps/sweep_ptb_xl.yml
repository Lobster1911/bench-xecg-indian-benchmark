program: sweep.py
method: random
name: train-ptb_xl-diagnosis_superclass
metric:
  goal: maximize
  name: test_f1/mean

parameters:
  lr_head:
    min: 0.0001
    max: 0.1
  lr_xlstm:
    min: 0.000001
    max: 0.01
  wd:
    min: 0.000001
    max: 0.1
  epochs:
    value: 30
  patch_size:
    value: 64
  dropout:
    min: 0.1
    max: 0.5
  embedding_size:
    value: 1024
  is_sweep:
    value: True

  num_epochs_warm_restart:
    value: 30

  xlstm_config:
    value: [ 'm', 's', 'm', 's', 'm', 's', 'm', 's', 'm' ]
  wandb_log:
    value: True
  checkpoint:
    value: 'pretrained_models/9l_1024/epoch=8-step=38070.ckpt'
  patch_embedding:
    value: 'enriched'
  bidirectional:
    value: False

  normalize:
    value: True
  random_shift:
    value: True
  nk_clean:
    value: True
  leads: 
    value: ['I', 'II', 'III', 'aVR', 'aVL', 'aVF', 'V1', 'V2', 'V3', 'V4', 'V5', 'V6']
  
  data_folder_ptbxl: 
    value: '/media/Volume/data/PTB-XL/nkclean_360_12l'
  labels_file_ptbxl:
    value: '/media/Volume/data/PTB-XL/nkclean_360_12l/ptbxl_database.csv'


  

  
